<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CineVerse — Stream Movies & Series</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #090a0f;
      --surface: rgba(18, 21, 33, 0.75);
      --surface-border: rgba(255, 255, 255, 0.12);
      --primary: #6366f1;
      --primary-glow: rgba(99, 102, 241, 0.4);
      --accent: #e11d48;
      --accent-glow: rgba(225, 29, 72, 0.4);
      --gold: #fbbf24;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --grad-btn: linear-gradient(135deg, #e11d48 0%, #a855f7 100%);
      --radius-lg: 20px;
      --radius-md: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* Ambient Background Glows */
    .blur-glow {
      position: fixed;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      filter: blur(160px);
      z-index: -1;
      pointer-events: none;
      opacity: 0.2;
    }
    .blur-1 { top: -80px; left: -100px; background: var(--primary); }
    .blur-2 { top: 50%; right: -120px; background: var(--accent); }

    /* Header Navigation */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(9, 10, 15, 0.88);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--surface-border);
    }
    .nav-container {
      max-width: 1360px;
      margin: 0 auto;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .logo {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 26px;
      font-weight: 700;
      color: #fff;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-badge { background: linear-gradient(90deg, #e11d48, #818cf8); -webkit-background-clip: text; background-clip: text; color: transparent; }

    .nav-tabs {
      display: flex;
      gap: 6px;
      background: rgba(255, 255, 255, 0.04);
      padding: 4px;
      border-radius: 999px;
      border: 1px solid var(--surface-border);
    }
    .tab-btn {
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      border: none;
      background: transparent;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 4px 15px var(--primary-glow);
    }

    .search-box {
      flex: 1;
      max-width: 320px;
      position: relative;
    }
    .search-box input {
      width: 100%;
      padding: 9px 16px 9px 38px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--surface-border);
      border-radius: 999px;
      color: #fff;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-box input:focus { border-color: var(--primary); }
    .search-box svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

    /* Direct ID Launcher Bar */
    .id-launch-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.03);
      padding: 4px 8px;
      border-radius: 8px;
      border: 1px solid var(--surface-border);
    }
    .id-launch-bar input {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 12px;
      width: 100px;
      outline: none;
    }
    .id-launch-bar select {
      background: #111420;
      color: #fff;
      border: 1px solid var(--surface-border);
      font-size: 11px;
      padding: 3px 6px;
      border-radius: 4px;
      outline: none;
    }
    .btn-launch {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Hero Section */
    .hero {
      position: relative;
      max-width: 1360px;
      margin: 20px auto 30px;
      height: 420px;
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid var(--surface-border);
    }
    .hero-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center 20%;
    }
    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(9, 10, 15, 0.95) 0%, rgba(9, 10, 15, 0.6) 60%, rgba(9, 10, 15, 0.1) 100%),
                  linear-gradient(0deg, rgba(9, 10, 15, 1) 0%, transparent 40%);
    }
    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 600px;
      padding: 40px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .hero-tag {
      padding: 4px 10px;
      background: rgba(251, 191, 36, 0.15);
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      color: var(--gold);
      width: fit-content;
      margin-bottom: 10px;
    }
    .hero h1 { font-family: 'Space Grotesk', sans-serif; font-size: 36px; margin-bottom: 10px; line-height: 1.1; }
    .hero p { color: var(--text-muted); font-size: 13px; line-height: 1.5; margin-bottom: 20px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

    /* Action Buttons */
    .btn-watch {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 22px;
      background: var(--grad-btn);
      color: #fff;
      border: none;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 20px var(--accent-glow);
      transition: all 0.25s ease;
      text-decoration: none;
    }
    .btn-watch:hover { transform: translateY(-2px); filter: brightness(1.15); }

    /* Media Grid & Cards */
    main { max-width: 1360px; margin: 0 auto; padding: 0 24px 60px; }
    .section-title { font-size: 22px; font-weight: 700; margin-bottom: 20px; }

    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 22px;
    }
    .media-card {
      background: var(--surface);
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid var(--surface-border);
      display: flex;
      flex-direction: column;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .media-card:hover {
      transform: translateY(-6px);
      border-color: var(--primary);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.8), 0 0 20px var(--primary-glow);
    }
    .poster-wrap {
      position: relative;
      aspect-ratio: 2/3;
      background: #121520;
      overflow: hidden;
    }
    .poster-wrap img { width: 100%; height: 100%; object-fit: cover; }
    
    .badge-quality {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(225, 29, 72, 0.9);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .badge-rating {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(9, 10, 15, 0.85);
      color: var(--gold);
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .card-info {
      padding: 14px;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
      gap: 12px;
    }
    .card-meta h3 {
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-meta p {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
      display: flex;
      justify-content: space-between;
    }

    .card-action-btn {
      width: 100%;
      padding: 9px 0;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--surface-border);
      border-radius: 8px;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .media-card:hover .card-action-btn {
      background: var(--grad-btn);
      border-color: transparent;
      box-shadow: 0 4px 15px var(--accent-glow);
    }

    /* Modal Video Player */
    .player-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.93);
      backdrop-filter: blur(20px);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .player-modal-backdrop.open { display: flex; }
    .player-modal {
      background: #0d0f18;
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 1000px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.95);
    }
    .player-header {
      padding: 16px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--surface-border);
    }
    .close-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
      font-weight: bold;
    }

    .iframe-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
    }
    .iframe-container iframe { width: 100%; height: 100%; border: none; }

    .episode-bar {
      padding: 12px 22px;
      background: rgba(255, 255, 255, 0.03);
      border-top: 1px solid var(--surface-border);
      display: none;
      align-items: center;
      gap: 12px;
    }
    .episode-bar.active { display: flex; }
    .custom-select {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--surface-border);
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
    }

    .server-bar {
      padding: 14px 22px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-top: 1px solid var(--surface-border);
      flex-wrap: wrap;
    }
    .server-btn {
      padding: 7px 14px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--surface-border);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .server-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 4px 12px var(--primary-glow);
    }

    @media (max-width: 768px) {
      .hero { height: 320px; }
      .hero-content { padding: 20px; }
      .nav-container { flex-direction: column; align-items: stretch; }
      .search-box { max-width: 100%; }
    }
  </style>
</head>
<body>

  <div class="blur-glow blur-1"></div>
  <div class="blur-glow blur-2"></div>

  <header>
    <div class="nav-container">
      <a href="#" class="logo"><span class="logo-badge">CineVerse</span></a>

      <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('trending', this)">Trending</button>
        <button class="tab-btn" onclick="switchTab('movie', this)">Movies</button>
        <button class="tab-btn" onclick="switchTab('tv', this)">TV Shows</button>
      </div>

      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="searchInput" placeholder="Search movies or series..." oninput="handleSearch()">
      </div>

      <div class="id-launch-bar">
        <input type="text" id="directIdInput" placeholder="TMDB ID (e.g. 1396)">
        <select id="directTypeSelect">
          <option value="tv">TV</option>
          <option value="movie">Movie</option>
        </select>
        <button class="btn-launch" onclick="launchDirectId()">Play</button>
      </div>
    </div>
  </header>

  <div class="hero">
    <div class="hero-bg" id="heroBg"></div>
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <div class="hero-tag">FEATURED SELECTION</div>
      <h1 id="heroTitle">Loading Title...</h1>
      <p id="heroOverview">Loading description...</p>
      <button class="btn-watch" id="heroPlayBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        Watch Now (4K)
      </button>
    </div>
  </div>

  <main>
    <div class="section-title" id="sectionTitle">Trending Movies & Series</div>
    <div class="media-grid" id="mediaGrid"></div>
  </main>

  <!-- Streaming Video Player Modal -->
  <div class="player-modal-backdrop" id="playerModal">
    <div class="player-modal">
      <div class="player-header">
        <h2 id="modalTitle" style="font-size:16px;">Now Playing</h2>
        <button class="close-btn" onclick="closePlayer()">✕</button>
      </div>
      
      <div class="iframe-container">
        <iframe id="videoPlayer" src="" allowfullscreen allow="autoplay; encrypted-media"></iframe>
      </div>

      <div class="episode-bar" id="episodeBar">
        <span style="font-size:12px; color:var(--text-muted)">Season:</span>
        <select class="custom-select" id="seasonSelect" onchange="onSeasonChange()"></select>
        <span style="font-size:12px; color:var(--text-muted); margin-left:8px;">Episode:</span>
        <select class="custom-select" id="episodeSelect" onchange="onEpisodeChange()"></select>
      </div>

      <div class="server-bar">
        <span style="font-size:12px; color:var(--text-muted); margin-right:6px;">Streaming Server:</span>
        <button class="server-btn active" onclick="switchServer('vidsrc_vip', this)">Server 1 (VidSrc VIP)</button>
        <button class="server-btn" onclick="switchServer('vidlink', this)">Server 2 (VidLink)</button>
        <button class="server-btn" onclick="switchServer('embed_2embed', this)">Server 3 (2Embed)</button>
        <button class="server-btn" onclick="switchServer('autoembed', this)">Server 4 (AutoEmbed)</button>
        <button class="server-btn" onclick="switchServer('smashy', this)">Server 5 (SmashyStream)</button>
      </div>
    </div>
  </div>

  <script>
    const API_KEY = "15d2aea6d8743773d2d03d329cf6e773";
    const BASE_URL = "https://api.themoviedb.org/3";

    // Offline Catalog Fallback
    const BUILTIN_CATALOG = [
      { id: "1396", media_type: "tv", name: "Breaking Bad", poster_path: "https://image.tmdb.org/t/p/w500/ztA3Bw8T3f8216cE3C2933C14k.jpg", backdrop_path: "https://image.tmdb.org/t/p/w1280/tsRy63Mu5cu8etL1X7ZLyf7UP1M.jpg", first_air_date: "2008-01-20", vote_average: 9.5, overview: "A high school chemistry teacher diagnosed with inoperable lung cancer turns to manufacturing methamphetamine." },
      { id: "1399", media_type: "tv", name: "Game of Thrones", poster_path: "https://image.tmdb.org/t/p/w500/1XS1oqL89vED2hC31I35231I8K.jpg", backdrop_path: "https://image.tmdb.org/t/p/w1280/2OMG02p41K22.jpg", first_air_date: "2011-04-17", vote_average: 8.4, overview: "Seven noble families fight for control of the mythical land of Westeros." },
      { id: "66732", media_type: "tv", name: "Stranger Things", poster_path: "https://image.tmdb.org/t/p/w500/uOOtwVbSr4QDjAGIifLDwpb2Pdl.jpg", backdrop_path: "https://image.tmdb.org/t/p/w1280/56v2KjBlU4XaOv9rVYEQypROD7P.jpg", first_air_date: "2016-07-15", vote_average: 8.7, overview: "When a young boy vanishes, a small town uncovers a mystery involving secret experiments and terrifying forces." },
      { id: "157336", media_type: "movie", title: "Interstellar", poster_path: "https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg", backdrop_path: "https://image.tmdb.org/t/p/w1280/pbrL2I1L68MvBw3o7pG4bM1m.jpg", release_date: "2014-11-05", vote_average: 8.7, overview: "A team of ex-NASA pilots embarks on a dangerous interstellar voyage through a wormhole to find humanity a new home." },
      { id: "27205", media_type: "movie", title: "Inception", poster_path: "https://image.tmdb.org/t/p/w500/xlaY2zyzMfkhk0HSC5VUwzoZPU1.jpg", backdrop_path: "https://image.tmdb.org/t/p/w1280/ii8QGacT3MXESqBckQlyrATY0lT.jpg", release_date: "2010-07-15", vote_average: 8.8, overview: "A thief who steals corporate secrets through dream-sharing technology is given the inverse task: planting an idea." },
      { id: "155", media_type: "movie", title: "The Dark Knight", poster_path: "https://image.tmdb.org/t/p/w500/qJ2tW6WMUDux911r6m7haRef0WH.jpg", backdrop_path: "https://image.tmdb.org/t/p/w1280/dqK9A3u3I2M3iM3.jpg", release_date: "2008-07-16", vote_average: 9.0, overview: "Batman raises the stakes in his war on crime to defeat the anarchic mastermind known as the Joker." },
      { id: "94605", media_type: "tv", name: "Arcane", poster_path: "https://image.tmdb.org/t/p/w500/fqld2239B2P.jpg", backdrop_path: "https://image.tmdb.org/t/p/w1280/fqld2239B2P.jpg", first_air_date: "2021-11-06", vote_average: 8.7, overview: "Set in Piltover and Zaun, the story follows the origins of two iconic League champions." },
      { id: "693134", media_type: "movie", title: "Dune: Part Two", poster_path: "https://image.tmdb.org/t/p/w500/6izwz7rsy95ARzTR3poZ8H6c5pp.jpg", backdrop_path: "https://image.tmdb.org/t/p/w1280/xOM138883626.jpg", release_date: "2024-02-27", vote_average: 8.5, overview: "Paul Atreides unites with Chani and the Fremen while seeking revenge against the conspirators who destroyed his family." }
    ];

    let currentTab = 'trending';
    let currentItem = null;
    let currentServer = 'vidsrc_vip';
    let currentSeason = 1;
    let currentEpisode = 1;
    let activeList = [];

    window.onload = init;

    async function init() {
      await fetchCatalog();
    }

    async function fetchCatalog() {
      let url = `${BASE_URL}/trending/all/day?api_key=${API_KEY}`;
      if (currentTab === 'movie') url = `${BASE_URL}/movie/popular?api_key=${API_KEY}`;
      if (currentTab === 'tv') url = `${BASE_URL}/tv/popular?api_key=${API_KEY}`;

      try {
        const res = await fetch(url);
        if (res.ok) {
          const data = await res.json();
          const items = (data.results || []).filter(x => x.poster_path);
          if (items.length > 0) {
            activeList = items;
            setHero(items[0]);
            renderGrid(items);
            return;
          }
        }
      } catch (e) {
        console.warn("Using offline catalog");
      }

      let filtered = BUILTIN_CATALOG;
      if (currentTab === 'movie') filtered = BUILTIN_CATALOG.filter(x => x.media_type === 'movie');
      if (currentTab === 'tv') filtered = BUILTIN_CATALOG.filter(x => x.media_type === 'tv');

      activeList = filtered;
      setHero(filtered[0]);
      renderGrid(filtered);
    }

    function setHero(item) {
      if (!item) return;
      const title = item.title || item.name;
      const backdrop = item.backdrop_path.startsWith('http') ? item.backdrop_path : `https://image.tmdb.org/t/p/w1280${item.backdrop_path}`;

      document.getElementById('heroBg').style.backgroundImage = `url('${backdrop}')`;
      document.getElementById('heroTitle').innerText = title;
      document.getElementById('heroOverview').innerText = item.overview || 'No overview available.';
      document.getElementById('heroPlayBtn').onclick = () => openPlayer(item);
    }

    function renderGrid(items) {
      const grid = document.getElementById('mediaGrid');
      grid.innerHTML = items.map((item, index) => {
        const isTv = item.media_type === 'tv' || !!item.first_air_date;
        const title = item.title || item.name;
        const year = (item.release_date || item.first_air_date || '').substring(0, 4) || '2024';
        const rating = item.vote_average ? item.vote_average.toFixed(1) : '8.5';
        const poster = item.poster_path.startsWith('http') ? item.poster_path : `https://image.tmdb.org/t/p/w500${item.poster_path}`;

        return `
          <div class="media-card">
            <div class="poster-wrap">
              <img src="${poster}" alt="${title}" loading="lazy">
              <div class="badge-rating">★ ${rating}</div>
              <div class="badge-quality">HD</div>
            </div>
            <div class="card-info">
              <div class="card-meta">
                <h3>${title}</h3>
                <p><span>${year}</span><span>${isTv ? 'TV Series' : 'Movie'}</span></p>
              </div>
              <button class="card-action-btn" onclick="openPlayerByIndex(${index})">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                Watch Now
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function openPlayerByIndex(index) {
      if (activeList[index]) openPlayer(activeList[index]);
    }

    let searchTimer = null;
    function handleSearch() {
      clearTimeout(searchTimer);
      const query = document.getElementById('searchInput').value.trim();

      if (!query) {
        document.getElementById('sectionTitle').innerText = "Trending Movies & Series";
        fetchCatalog();
        return;
      }

      searchTimer = setTimeout(async () => {
        document.getElementById('sectionTitle').innerText = `Search Results for "${query}"`;
        try {
          const res = await fetch(`${BASE_URL}/search/multi?api_key=${API_KEY}&query=${encodeURIComponent(query)}`);
          if (res.ok) {
            const data = await res.json();
            const results = (data.results || []).filter(x => x.poster_path);
            if (results.length > 0) {
              activeList = results;
              renderGrid(results);
              return;
            }
          }
        } catch (e) {}

        const fallbackResults = BUILTIN_CATALOG.filter(x => {
          const t = (x.title || x.name || '').toLowerCase();
          return t.includes(query.toLowerCase());
        });
        activeList = fallbackResults;
        renderGrid(fallbackResults);
      }, 300);
    }

    function launchDirectId() {
      const id = document.getElementById('directIdInput').value.trim();
      const type = document.getElementById('directTypeSelect').value;
      if (!id) return;

      openPlayer({ id: id, media_type: type, title: `Title ID: ${id}` });
    }

    function switchTab(tab, btn) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('searchInput').value = '';
      document.getElementById('sectionTitle').innerText = tab === 'movie' ? 'Popular Movies' : tab === 'tv' ? 'Popular TV Series' : 'Trending Movies & Series';
      fetchCatalog();
    }

    async function openPlayer(item) {
      currentItem = item;
      const isTv = item.media_type === 'tv' || !!item.first_air_date;
      const title = item.title || item.name;

      document.getElementById('modalTitle').innerText = title;
      const epBar = document.getElementById('episodeBar');

      if (isTv) {
        epBar.classList.add('active');
        setupSeasons();
      } else {
        epBar.classList.remove('active');
      }

      loadStream();
      document.getElementById('playerModal').classList.add('open');
    }

    function setupSeasons() {
      const seasonSelect = document.getElementById('seasonSelect');
      seasonSelect.innerHTML = '';
      for (let i = 1; i <= 10; i++) {
        seasonSelect.innerHTML += `<option value="${i}">Season ${i}</option>`;
      }
      currentSeason = 1;
      setupEpisodes(24);
    }

    function setupEpisodes(count) {
      const episodeSelect = document.getElementById('episodeSelect');
      episodeSelect.innerHTML = '';
      for (let i = 1; i <= count; i++) {
        episodeSelect.innerHTML += `<option value="${i}">Episode ${i}</option>`;
      }
      currentEpisode = 1;
    }

    function onSeasonChange() {
      currentSeason = document.getElementById('seasonSelect').value;
      loadStream();
    }

    function onEpisodeChange() {
      currentEpisode = document.getElementById('episodeSelect').value;
      loadStream();
    }

    function switchServer(serverKey, btn) {
      currentServer = serverKey;
      document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      loadStream();
    }

    function loadStream() {
      if (!currentItem) return;
      const isTv = currentItem.media_type === 'tv' || !!currentItem.first_air_date;
      const id = currentItem.id;
      let url = '';

      if (currentServer === 'vidsrc_vip') {
        url = isTv ? `https://vidsrc.vip/embed/tv/${id}/${currentSeason}/${currentEpisode}` : `https://vidsrc.vip/embed/movie/${id}`;
      } else if (currentServer === 'vidlink') {
        url = isTv ? `https://vidlink.pro/tv/${id}/${currentSeason}/${currentEpisode}` : `https://vidlink.pro/movie/${id}`;
      } else if (currentServer === 'embed_2embed') {
        url = isTv ? `https://www.2embed.cc/embedtv/${id}&s=${currentSeason}&e=${currentEpisode}` : `https://www.2embed.cc/embed/${id}`;
      } else if (currentServer === 'autoembed') {
        url = isTv ? `https://player.autoembed.cc/embed/tv/${id}/${currentSeason}/${currentEpisode}` : `https://player.autoembed.cc/embed/movie/${id}`;
      } else if (currentServer === 'smashy') {
        url = isTv ? `https://embed.smashystream.com/playere.php?tmdb=${id}&season=${currentSeason}&episode=${currentEpisode}` : `https://embed.smashystream.com/playere.php?tmdb=${id}`;
      }

      document.getElementById('videoPlayer').src = url;
    }

    function closePlayer() {
      document.getElementById('playerModal').classList.remove('open');
      document.getElementById('videoPlayer').src = "";
    }
  </script>
</body>
</html>
